input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "event"
    skip_on_invalid_json => true
  }
  if [event][@timestamp] {
    date {
      match => ["[event][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
  if [event][log.level] {
    mutate {
      add_field => { "log.level" => "%{[event][log.level]}" }
    }
  }
  if [event][message] {
    mutate {
      add_field => { "event.message" => "%{[event][message]}" }
    }
  }
  if [event][service.name] {
    mutate {
      add_field => { "service.name" => "%{[event][service.name]}" }
    }
  }
  if [event][status_code] {
    mutate {
      add_field => { "http.response.status_code" => "%{[event][status_code]}" }
    }
  }
  if [event][route] {
    mutate {
      add_field => { "url.path" => "%{[event][route]}" }
    }
  }
  if [event][requestId] {
    mutate {
      add_field => { "request.id" => "%{[event][requestId]}" }
    }
  }
  if [event][error_type] {
    mutate {
      add_field => { "error.type" => "%{[event][error_type]}" }
    }
  }
  mutate {
    add_field => { "event.dataset" => "practice-api" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "practice-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
